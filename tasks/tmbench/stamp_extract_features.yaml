name: stamp_extract_features
repo_url: https://github.com/KatherLab/STAMP
description: >
  Perform feature extraction using CTransPath with STAMP on a folder of whole slide
  images (.svs), and save the resulting features to a new folder. Returns the number
  of slides processed.
inputs:
  output_dir: "/tmp/stamp_features"
  slide_dir: "/path/to/slides"
expected_output: >
  Dict with key 'num_processed_slides' (int) — number of slides processed.
requires_gpu: true
# STATUS: Blocked — requires .svs whole slide image files (large proprietary data)
# Obtain TCGA slides from https://portal.gdc.cancer.gov/

