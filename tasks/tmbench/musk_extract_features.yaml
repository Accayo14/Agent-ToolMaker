name: musk_extract_features
repo_url: https://github.com/lilab-stanford/MUSK
description: >
  Perform feature extraction on a pathology image using the vision encoder of MUSK
  (Multimodal Universal biomarker for cancer pathology with Self-Knowledge distillation).
  Requires HuggingFace access token (HF_TOKEN env var) — request access at
  https://huggingface.co/xiangjx/musk
inputs:
  input_image: "/tmp/test_patch.png"
expected_output: >
  Dict with key 'features' containing a list of floats.
requires_gpu: true
# STATUS: Blocked — requires approved HuggingFace access to xiangjx/musk (gated model)

validation_tests: |
  import numpy as np
  from PIL import Image
  from tool import run_tool

  def _make_patch(path, size=(224, 224)):
      arr = np.random.randint(100, 230, (*size, 3), dtype=np.uint8)
      Image.fromarray(arr).save(path)

  def test_returns_feature_vector():
      img_path = "/tmp/musk_val.png"
      _make_patch(img_path)
      result = run_tool(input_image=img_path)
      assert isinstance(result, dict)
      fv_key = next((k for k in result if isinstance(result[k], list)), None)
      assert fv_key, f"No list value found. Keys: {list(result.keys())}"
      assert len(result[fv_key]) > 0

  def test_feature_vector_numeric():
      img_path = "/tmp/musk_val2.png"
      _make_patch(img_path)
      result = run_tool(input_image=img_path)
      fv_key = next((k for k in result if isinstance(result[k], list)), None)
      fv = result[fv_key]
      assert all(isinstance(x, (int, float)) for x in fv[:10])
