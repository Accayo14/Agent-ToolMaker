name: tabpfn_predict
repo_url: https://github.com/PriorLabs/TabPFN
description: >
  Train a predictor using TabPFN on a tabular dataset (given as CSV file paths).
  Evaluate the predictor on the test set and return ROC AUC, accuracy, and
  per-sample class probabilities.
inputs:
  train_csv: "/tmp/train.csv"
  test_csv: "/tmp/test.csv"
  feature_columns: ["mean radius", "mean texture", "mean perimeter", "mean area"]
  target_column: "target"
expected_output: >
  Dict with keys: roc_auc (float 0-1), accuracy (float 0-1),
  probs (list of floats, one per test sample).
requires_gpu: false

validation_tests: |
  import os
  import pandas as pd
  from sklearn.datasets import load_breast_cancer
  from sklearn.model_selection import train_test_split
  from tool import run_tool

  def _make_breast_cancer_csvs():
      data = load_breast_cancer()
      df = pd.DataFrame(data.data, columns=data.feature_names)
      df["target"] = data.target
      train, test = train_test_split(df, test_size=0.2, random_state=42)
      train.to_csv("/tmp/bc_train.csv", index=False)
      test.to_csv("/tmp/bc_test.csv", index=False)
      return list(data.feature_names), "target", len(test)

  def test_returns_required_keys():
      feat_cols, target_col, n_test = _make_breast_cancer_csvs()
      result = run_tool(
          train_csv="/tmp/bc_train.csv",
          test_csv="/tmp/bc_test.csv",
          feature_columns=feat_cols,
          target_column=target_col,
      )
      assert isinstance(result, dict), f"Expected dict, got {type(result)}"
      assert "roc_auc" in result, f"Missing 'roc_auc'. Keys: {list(result.keys())}"
      assert "accuracy" in result, f"Missing 'accuracy'. Keys: {list(result.keys())}"
      assert "probs" in result, f"Missing 'probs'. Keys: {list(result.keys())}"

  def test_roc_auc_above_chance():
      feat_cols, target_col, n_test = _make_breast_cancer_csvs()
      result = run_tool(
          train_csv="/tmp/bc_train.csv",
          test_csv="/tmp/bc_test.csv",
          feature_columns=feat_cols,
          target_column=target_col,
      )
      roc = result["roc_auc"]
      assert isinstance(roc, float), f"roc_auc must be float, got {type(roc)}"
      assert roc >= 0.7, f"TabPFN should achieve >0.7 AUC on breast cancer, got {roc:.3f}"

  def test_probs_length_matches_test_set():
      feat_cols, target_col, n_test = _make_breast_cancer_csvs()
      result = run_tool(
          train_csv="/tmp/bc_train.csv",
          test_csv="/tmp/bc_test.csv",
          feature_columns=feat_cols,
          target_column=target_col,
      )
      probs = result["probs"]
      assert len(probs) == n_test, (
          f"Expected {n_test} probabilities (one per test sample), got {len(probs)}"
      )
